name: Verify

on:
  push:
  pull_request:

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint -w apps/web
      - run: node node_modules/typescript/bin/tsc --noEmit --incremental false -p apps/web/tsconfig.json
      - run: npm run build:web

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Release gate: high/critical advisories fail CI until remediated.
      - run: npm audit --omit=dev --audit-level=high
