<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colegio de Montalban - OJT Practicum Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #0A3D24 0%, #062415 70%, #04140b 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 204, 0, 0.3);
      padding: 40px 48px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-container {
      width: 84px;
      height: 84px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid #FFCC00;
      border-radius: 22px;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 0 30px rgba(255, 204, 0, 0.2);
      animation: pulse 2s infinite ease-in-out;
    }
    .logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    h1 {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-family: Georgia, serif;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 11px;
      font-weight: 700;
      color: #FFCC00;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #FFCC00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    .status {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .hint {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.5;
      margin-top: 12px;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .btn-retry {
      margin-top: 16px;
      padding: 10px 24px;
      background: #0A3D24;
      border: 1.5px solid #FFCC00;
      color: #FFCC00;
      font-weight: 800;
      font-size: 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-retry:hover {
      background: #062415;
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 204, 0, 0.2); }
      50% { transform: scale(1.04); box-shadow: 0 0 35px rgba(255, 204, 0, 0.4); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <img class="logo" src="../assets/icon.png" alt="CdM Logo">
    </div>
    <h1>Colegio de Montalban</h1>
    <div class="subtitle">OJT Practicum Portal</div>
    
    <div class="spinner"></div>
    <div class="status" id="status-text">Connecting to Practicum Cloud...</div>

    <div class="hint" id="hint-text">
      Establishing secure connection to Colegio de Montalban servers...<br>
      Please wait while your workspace loads.
    </div>

    <button class="btn-retry" id="btn-retry" onclick="triggerReconnect()">Retry Connection</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const targetUrl = params.get('url') || 'https://ojt-monitoring-and-management-system.vercel.app';
    const isProd = params.get('isProd') === '1' || targetUrl.startsWith('https://');
    let attempts = 0;

    function triggerReconnect() {
      attempts++;
      document.getElementById('status-text').innerText = 'Connecting to ' + targetUrl + ' (Attempt ' + attempts + ')...';
      if (window.electronAPI && typeof window.electronAPI.retryConnection === 'function') {
        window.electronAPI.retryConnection();
      } else {
        window.location.href = targetUrl;
      }
    }

    // Dynamic hint based on environment
    if (!isProd) {
      document.getElementById('hint-text').innerHTML = 
        'Development Server: <strong>http://localhost:3000</strong><br>Run <code style="color:#FFCC00;">npm run dev:desktop</code> from workspace.';
    } else {
      document.getElementById('hint-text').innerHTML = 
        'Connecting to live campus cloud portal.<br>If this screen persists, please verify your internet connection.';
    }

    // Auto-poll retry every 3 seconds
    setInterval(() => {
      triggerReconnect();
    }, 3000);
  </script>
</body>
</html>
